services:
  livekit:
    image: livekit/livekit-server:v1.8
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880"       # WebSocket / HTTP signaling
      - "7881:7881"       # TCP fallback for WebRTC
      - "7882:7882/udp"   # UDP for WebRTC media
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
